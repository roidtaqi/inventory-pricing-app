services:
  - type: web
    name: inventory-pricing-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SYNC_URL
        value: wss://integrated-pos-sync-server.onrender.com
      - key: VITE_SYNC_API_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
